# Netlify configuration — Complete Construction & Home Solutions LLC
#
# Static site, no build step. Netlify serves the repository root as-is.
#
# ┌──────────────────────────────────────────────────────────────┐
# │ AT LAUNCH: delete the X-Robots-Tag line in the [[headers]]   │
# │ block marked PREVIEW ONLY, and remove the <meta name="robots"│
# │ content="noindex, nofollow"> tag from index.html.            │
# │ Until both are gone the site will not appear in Google.      │
# └──────────────────────────────────────────────────────────────┘

[build]
  publish = "."
  command = ""

# Serverless lead endpoint. The function declares its own route
# (/api/lead) via `export const config`, so no redirect is needed.
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# ---------------------------------------------------------------
# Security headers, applied to everything
# ---------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=(), payment=(), interest-cohort=()"

    # PREVIEW ONLY — delete this line when the client approves the site.
    # It keeps an unapproved demo carrying a real business name out of search
    # results even if someone links to it.
    X-Robots-Tag = "noindex, nofollow"

# ---------------------------------------------------------------
# Caching
# HTML stays fresh so edits show up immediately while you are still
# iterating with the client. Images and fonts never change once
# deployed, so they are cached hard.
# ---------------------------------------------------------------
[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/fonts/files/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ---------------------------------------------------------------
# Keep repo housekeeping files off the public site
# ---------------------------------------------------------------
[[redirects]]
  from = "/README.md"
  to = "/index.html"
  status = 404
  force = true

[[headers]]
  for = "/api/*"
  [headers.values]
    Cache-Control = "no-store"
